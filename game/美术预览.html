<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>豚物语 · 动作与猪种美术预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee2c7;color:#473527;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1380px;margin:auto;padding:36px 28px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:2px solid #ae906b;padding-bottom:24px}h1{font:36px Georgia,"STKaiti",serif;margin:5px 0}header p{margin:0;color:#796044}small{letter-spacing:2px;color:#806645}a{color:#5b703e}button,select{border:1px solid #947349;background:#fff7e5;color:#443524;padding:9px 14px;font:inherit;border-radius:3px;cursor:pointer}button.active{background:#546c44;color:#fff7e5}button:focus-visible,select:focus-visible{outline:3px solid #ac722f;outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:22px 0}.hint{font-size:13px;color:#816748}.farmer-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 28px}.farmer-stage{background:#dfcda8;border:1px solid #b79b70;position:relative;height:164px;overflow:hidden}.farmer-stage p{margin:8px 12px;color:#725738;font-size:13px}.player-sprite{position:absolute;width:64px;height:64px;transform:scale(1.55);transform-origin:center bottom}.art-canvas{width:64px;height:64px;image-rendering:pixelated;display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{min-width:0;background:#fff5dc;border:1px solid #bca177;padding:16px}.card h2{font-size:16px;margin:8px 0 1px}.card p{font-size:12px;color:#806646;min-height:38px;margin:6px 0}.stage{position:relative;height:132px;background:linear-gradient(#e8dabb 80%,#d9c89b 80%);overflow:hidden}.pig-sprite{position:absolute;width:64px;height:64px;transform:scale(1.6);transform-origin:center bottom}.card small{letter-spacing:0;font-size:12px}.hidden{display:none}.foot{margin-top:28px;border-top:1px solid #b79b70;padding-top:20px;font-size:13px;color:#806646}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header{display:block}main{padding:22px 16px}.farmer-row{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style>
<main><header><div><small>豚物语 / ART UPDATE 1.12</small><h1>每一只，都有自己的模样。</h1><p>28 种猪的体态与毛色，以及连续的行走和日常动作。</p></div><a href="index.html">进入游戏 →</a></header>
<div class="toolbar" id="controls"><button class="active" data-mode="idle">站立</button><button data-mode="walking">行走</button><button data-mode="drinking">饮水</button><button data-mode="rooting">拱地</button><button data-mode="resting">休息</button><button data-mode="rolling">打滚</button><label>路线 <select id="filter"><option value="all">全部猪种</option><option>肉猪</option><option>宠物猪</option><option>繁育猪</option></select></label></div>
<p class="hint">人物以四个方向展示连续步态。点击动作按钮，可同时检查不同猪种的动作与轮廓。</p><div class="farmer-row" id="farmers"></div><div class="grid" id="breeds"></div><p class="foot">此页仅用于美术预览，不读取或修改游戏存档。系统设置“减少动态效果”时，猪只原地动作自动简化。</p></main>
<script src="data.js"></script><script src="breed-art.js"></script>
<script>
const dirs=['down','left','right','up'];document.querySelector('#farmers').innerHTML=dirs.map((d,i)=>`<div class="farmer-stage"><p>${['正面','向左','向右','背面'][i]}</p><div class="player-sprite walking dir-${d}" style="left:40%;top:55%"></div></div>`).join('');
document.querySelector('#breeds').innerHTML=PIG_DATA.BREEDS.map((b,i)=>`<article class="card" data-role="${b.role}"><div class="stage"><div class="pig-sprite" data-breed="${b.id}" data-behavior="idle" data-behavior-duration="4" style="left:34%;top:43%"></div></div><h2>${b.name}</h2><small>${b.origin} · ${b.role}</small><p>${PIG_ART[b.id].note}</p></article>`).join('');
let mode='idle',start=performance.now(),lastFrame=0;document.querySelector('#controls').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;start=performance.now();document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.pig-sprite').forEach(p=>{p.dataset.behavior=mode;p.classList.remove('flip');const a=window.FarmArt?.actors.get(p);if(a)a.modeTime=0})};
document.querySelector('#filter').onchange=e=>document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',e.target.value!=='all'&&c.dataset.role!==e.target.value));
function demo(t){const phase=(t-start)/1000;document.querySelectorAll('.player-sprite').forEach((el,i)=>{const n=(t/3000)%2;el.style.left=(24+(n<1?n:2-n)*25)+'%'});if(mode==='walking')document.querySelectorAll('.pig-sprite').forEach(el=>{const n=(phase/4)%2;el.style.left=(18+(n<1?n:2-n)*38)+'%';el.classList.toggle('flip',n>=1)});requestAnimationFrame(demo)}requestAnimationFrame(demo);
</script><script src="animation.js"></script></html>
